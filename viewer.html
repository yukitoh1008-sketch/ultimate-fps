      #teamBox .field { min-height: 205px; } #teamBox .pl .ph, #teamBox .pl .ph img { width: 40px; height: 40px; } #teamBox .pl b { font-size: 11px; } #teamBox .bench .list { gap: 2px; padding: 2px 0; } #teamBox .btns { padding: 6px 0 8px; } }

        const cv = window.Uniform && Uniform.preview(b.dataset.d, st.color, 54); if (cv) b.querySelector('.cv').appendChild(cv);

      // 選手: ドラッグ＝入れ替え（ベンチ ⇔ フィールドの選手の上で離す）／動かさずに離す（タップ）＝選手を見る（2026-11-21）
      box.querySelectorAll('.pl').forEach((b) => {

            const el = document.elementFromPoint(x, y), p = el && el.closest ? el.closest('#teamBox .pl') : null;

            if (!gh) { if (Math.hypot(ev.clientX - x0, ev.clientY - y0) < 8) return; gh = b.querySelector('img').cloneNode(); gh.id = 'tmGhost'; document.body.appendChild(gh); b.classList.add('drag'); }
            gh.style.left = ev.clientX + 'px'; gh.style.top = ev.clientY + 'px';
            const p = target(ev.clientX, ev.clientY);
            if (p !== over) { if (over) over.classList.remove('drop'); over = p; if (over) over.classList.add('drop'); }
          };
          const up = (ev) => {
            removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
            if (!gh) { if (ev.type === 'pointerup') openPlayer(n, st); return; }   // 動かさずに離した＝タップ
            gh.remove(); b.classList.remove('drag');
            if (over) { const m = +over.dataset.n, out = st.starters.includes(n) ? n : m, inn = out === n ? m : n; st.starters[st.starters.indexOf(out)] = inn; }
            draw();
          };
          addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
        });
      });
      box.querySelector('[data-a=reset]').addEventListener('click', (e) => { e.stopPropagation(); if (opt.lineup) st.starters = def().starters; else st = def(); sel = null; draw(); });   // 試合前は先発だけ戻す
      box.querySelector('[data-a=ok]').addEventListener('click', (e) => { e.stopPropagation(); save(st); box.style.display = 'none'; if (opt.onDone) opt.onDone(st); });
    };
    draw();
    box.style.display = 'flex';
    if (window.Uniform && !Uniform.isReady()) Uniform.ready.then(() => { if (box.style.display === 'flex') draw(); });   // 見本はあとから
  }
  window.TeamUI = { open, load, COLORS, openPlayer, isOpen: () => box.style.display === 'flex' || pv.style.display === 'flex' };

<script>
/* ============================================================
 * render3d.js ― 試合の「背景・フィールド・選手」を three.js（本物の3D）で描く
 *
 * なぜ: これまでの試合は、自作の簡易3D（棒人間）で描いていた。3D試作 v3 で作った
 *       「身長1.78mの人＋走りの動き＋体の傾き＋切り返し」を、試合にそのまま載せる。
 * しくみ:
 *   - 試合の計算（match.js）は一切変えない。毎フレーム、選手の位置とカメラを受け取って描くだけ
 *   - WebGL の画面を一番下に置き、その上に今までの 2D の画面（ディスク・番号札・HUD）を透明で重ねる
 *   - 選手の動き方: 位置の変化から速さ・向き・加速を求め、走り／後ろ走り／横すり足／待機を混ぜる。
 *     足の運びは「歩幅で割った分だけ進める」ので地面を滑らない（3D試作 v3 と同じ考え方）
 *   - 読み込み（約10MB）が終わるまでは、今までの描き方のまま動く
 *
 *   座標: 試合は x=横, y=縦, z=高さ。three.js は (x, z, -y) に置き換える
 * ============================================================ */
(function () {
  'use strict';
  const R3D = window.R3D = { ready: false, error: null, progress: 0 };
  const RIG_REST = 'assets/mocap/rig_rest.json';   // 骨の向きの基準（Mixamo のファイルは 2026-11-19 から読まない）
  const VRM_BODIES = { m: 'assets/vroid/vroid_m.vrm', l: 'assets/vroid/vroid_l.vrm', f: 'assets/vroid/vroid_f.vrm' };   // 林さんが VRoid で作った体（標準男性・大柄・女性。無い体は標準男性）
  const HEIGHT = 1.78;

  (async function boot() {
    let THREE, GLTFLoader, SkeletonUtils;
    try {
      THREE = await import('three');
      ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'));
      SkeletonUtils = await import('three/addons/utils/SkeletonUtils.js');
    } catch (e) { R3D.error = '3Dの部品を読み込めない（ネット接続を確認）: ' + e; return; }

    // ---------------- 画面 ----------------
    const glc = document.getElementById('gl');
    const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, powerPreference: 'high-performance' });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene = new THREE.Scene();
    const SKY = new THREE.Color(0x5d9bea);   // 空の筒の一番上の色とそろえる（境目の線が出ないように）
    scene.background = SKY;
    scene.fog = new THREE.Fog(0xd6e5f0, 70, 260);

      const f = d2 > d1 ? _f2 : _f1;
      R3D.pivot.set(pl, [f.x - _hp.x, -(f.z - _hp.z)]);
    }
    // 仕上げのならし: 上半身（背骨・首・頭・肩・腕・手）の骨の回転を、前のコマから少し遅れて追いかけさせる（約0.06秒）。
    //   動画の読み取りの細かいぶれ、動きの切り替え、手のひらの向き直しなどの「カクッ」を消す。
    //   脚と腰は、足が地面を滑らないように、ならさない
    const UPPER = /(Spine\d?|Neck|Head|Shoulder|Arm|ForeArm|Hand)$/;
    function smoothUpper(v, dt) {
      // 追いかける速さ（秒）: 首・頭は強め（人も走りながら頭をなるべく揺らさない）、背骨は中くらい、腕は弱め
      if (!v.upper) { v.upper = []; v.obj.traverse((o) => { if (o.isBone && UPPER.test(o.name)) v.upper.push({ b: o, q: o.quaternion.clone(), tc: /(Neck|Head)$/.test(o.name) ? 0.12 : /Spine/.test(o.name) ? 0.08 : 0.06 }); }); }
      for (const u of v.upper) { u.q.slerp(u.b.quaternion, 1 - Math.exp(-dt / u.tc)); u.b.quaternion.copy(u.q); }
    }
    // フォア・バックの構えでは手のひらを上に向ける（林さんの指摘）。
    //   動画からの置きかえは「腕のねじり」を読み取れないので、手のひらの向きがばらばらになる。
    //   前腕を、その長さの向きの軸まわりにねじって、手のひら（手の骨の +Z）が上を向くようにする。
    //   ハマー（手が頭より高い）では、ねじらない（手の高さで少しずつ弱める）
    const _a = new THREE.Vector3(), _n = new THREE.Vector3(), _u = new THREE.Vector3(), _hq = new THREE.Quaternion(), _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();
    function palmUp(v, k = 1) {
      const { RightForeArm: fa, RightHand: hd, Head: head } = v.arm;
      if (!fa || !hd || !head) return;
      v.obj.updateMatrixWorld(true);
      fa.getWorldPosition(_p1); hd.getWorldPosition(_p2);
      _a.copy(_p2).sub(_p1).normalize();                         // 前腕の向き
      hd.getWorldQuaternion(_hq);
      _n.set(0, 0, 1).applyQuaternion(_hq);                       // 手のひらの向き
      _u.set(0, 1, 0);
      _n.addScaledVector(_a, -_n.dot(_a)); _u.addScaledVector(_a, -_u.dot(_a));   // 前腕に垂直な面へ
      if (_n.lengthSq() < 1e-6 || _u.lengthSq() < 1e-6) return;  // 前腕が真上・真下のときは決められない
      _n.normalize(); _u.normalize();
      let ang = Math.acos(Math.max(-1, Math.min(1, _n.dot(_u))));
      if (new THREE.Vector3().crossVectors(_n, _u).dot(_a) < 0) ang = -ang;
      head.getWorldPosition(_p1);
      const w = Math.max(0, Math.min(1, (_p1.y - _p2.y) / 0.3));  // 手が頭より高いほど弱める（ハマー）
      if (w > 0) addWorldRot(fa, _a, ang * w * k);
    }
    const kfOf = (f, s) => Math.abs(f) / (Math.abs(f) + Math.abs(s) + 1e-6);

    // ---------------- 毎フレーム（match.js から呼ぶ） ----------------
    // st: { W, H, dpr, cam: {e, f, u}, fov, players: [{ pl, p, visible, alpha, pose, lookAt, faceLook, event }], dt }
    let lastW = 0, lastH = 0;
    R3D.frame = function (st) {
      if (st.W !== lastW || st.H !== lastH) {
        renderer.setPixelRatio(st.dpr); renderer.setSize(st.W / st.dpr, st.H / st.dpr, false);
        lastW = st.W; lastH = st.H;
      }
      camera.fov = st.fov; camera.aspect = st.W / st.H; camera.updateProjectionMatrix();
      const e = st.cam.e, f = st.cam.f, u = st.cam.u;
      camera.position.copy(W3(e[0], e[1], e[2]));
      camera.up.set(u[0], u[2], -u[1]);
      camera.lookAt(W3(e[0] + f[0], e[1] + f[1], e[2] + f[2]));
      // 影を落とす範囲は、カメラが見ている先の地面のあたり
      const k = f[2] < -0.05 ? Math.min(30, e[2] / -f[2]) : 18;
      const fx = e[0] + f[0] * k, fy = e[1] + f[1] * k;
      sun.target.position.copy(W3(fx, fy, 0)); sun.position.copy(W3(fx + 25, fy - 15, 45));
      R3D.sky.position.set(e[0], 640, -e[1]);
      const dt = Math.max(1 / 240, Math.min(0.05, st.dt || 1 / 60));
      const seen = new Set();
      for (const s of st.players) {
        let v = VIS.get(s.pl);
        if (!v) { v = makePlayer(s.pl); VIS.set(s.pl, v); }
        seen.add(s.pl);
        v.rig.visible = s.visible;
        if (v.heldDisc && v.heldDisc.visible !== !!s.hasDisc) { v.heldDisc.visible = !!s.hasDisc; v.heldDisc.userData.grip(!!s.hasDisc); }   // ディスクを持っている間（振りかぶり中も）だけ手に出し、親指で挟む
        if (st.paused) { v.prev = s.p.slice(); v.vpos = s.p.slice(); continue; }   // 作戦タイム中は止める
        animate(s.pl, v, s, dt);
        if (Math.abs(s.alpha - v.alpha) > 0.01) {
          v.alpha = s.alpha;
          for (const m of v.mats) { m.transparent = v.alpha < 1 || !!m.userData.t0; m.opacity = v.alpha; m.depthWrite = v.alpha >= 1 && !m.userData.t0; m.needsUpdate = true; }
        }
      }
      for (const [pl, v] of VIS) if (!seen.has(pl)) v.rig.visible = false;   // 控えに下がった選手は隠す
      renderer.render(scene, camera);
    };
    // チームの服の色を変える: そのチームの体を消して、次の描画で作り直す
    R3D.setWear = function (team, top, bottom) {
      const w = TEAM_WEAR[team]; if (w.top.join() === top.join() && w.bottom.join() === bottom.join()) return;
      TEAM_WEAR[team] = { top, bottom };
      for (const [pl, v] of VIS) if (pl.team === team) { scene.remove(v.rig); VIS.delete(pl); }
    };
    // 全員の体を作り直す（ユニフォームを変えたとき）
    R3D.rebuildAll = function () { for (const [, v] of VIS) scene.remove(v.rig); VIS.clear(); };
    if (window.Uniform) Uniform.ready.then(() => R3D.rebuildAll());   // ユニフォームの素材が読めたら、着替える
    R3D.renderer = renderer; R3D.vis = VIS; R3D.camera = camera;   // 確認用
    R3D.ready = true;
  })();
})();

</script>
<script>
  (function () {
    const { n, r } = window.VIEW;
    // 能力の表
    const COLS = [['spd', '速さ'], ['cut', '切り返し'], ['hgt', '高さ'], ['ctch', 'キャッチ'], ['acc', '正確さ'], ['pow', 'パワー'], ['rea', '反応'], ['iq', '賢さ'], ['sta', '体力']];
    const ROLE = { H: 'ハンドラー', C: 'カッター', D: 'ディープ' };
    const ov = Math.round(COLS.reduce((a, c) => a + r.st[c[0]], 0) / COLS.length);
    const T = window.UFPS_TRAIT || {};
    document.getElementById('info').innerHTML = `<h2>#${n} ${r.name}</h2><p class="sub">${r.en}　／　${ROLE[r.role]}</p>`
      + `<div class="ov"><b>${ov}</b><span>総合</span></div>`
      + `<div class="st">${COLS.map(([k, lb]) => `<span>${lb}</span><span class="bar"><i class="${r.st[k] >= 70 ? 'hi' : ''}" style="width:${r.st[k]}%"></i></span><span class="num">${r.st[k]}</span>`).join('')}</div>`
      + `<h4>個性</h4>${(r.traits || []).map((t) => `<span class="tr">${T[t] || t}</span>`).join('') || '<span class="sub">なし</span>'}`;
    document.title = `#${n} ${r.name} ― アルティメットFPS`;

    // 3D: 試合のフィールドの真ん中に立たせて、カメラを周りに回す
    const pl = { team: 0, n, r, build: 1 + 0.035 * (r.st.pow - 50) / 20 };
    const hScale = (1.79 + 0.065 * (r.st.hgt - 50) / 20) / 1.79;
    const P = [18.5, 50], LOOK = [18.5, 40];   // 選手は -y（カメラの最初の向きの正面）を向く
    let ang = 0, drag = null, idleT = 0, last = performance.now();
    const ZQ = new URLSearchParams(location.search), zh = +ZQ.get('zh') || 0, zd = +ZQ.get('zd') || 0, fixA = ZQ.has('ang') ? +ZQ.get('ang') : null;   // 近くから見る（確認用）
    const cv = document.getElementById('gl'), msg = document.getElementById('msg');
    cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, a: ang }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
    cv.addEventListener('pointermove', (e) => { if (drag) { ang = drag.a - (e.clientX - drag.x) * 0.012; idleT = 0; } });
    const up = () => { drag = null; cv.style.cursor = 'grab'; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!R3D.ready) {
        msg.textContent = R3D.error ? R3D.error : `読み込み中… ${Math.round((R3D.progress || 0) * 100)}%`;
        requestAnimationFrame(loop); return;
      }
      msg.style.display = 'none';
      if (!drag) { idleT += dt; if (idleT > 1.5) ang += dt * 0.35; }   // さわっていなければ、ゆっくり回る
      const dpr = Math.min(2, window.devicePixelRatio || 1), W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
      // 右側に能力の欄があるので、選手は画面の左寄りに見えるよう、見る点を少し右へずらす
      if (fixA !== null) ang = fixA;
      const D = (zd || 3.6) * hScale, th = (zh || 1.0) * hScale, side = !zd && innerWidth > 520 ? 0.55 * hScale : 0;
      const ex = P[0] + Math.sin(ang) * D, ey = P[1] - Math.cos(ang) * D, ez = (zh || 1.15) * hScale;
      const rx = Math.cos(ang), ry = Math.sin(ang);   // カメラから見た右
      const tx = P[0] + rx * side, ty = P[1] + ry * side;
      let f = [tx - ex, ty - ey, th - ez]; const fl = Math.hypot(...f); f = f.map((v) => v / fl);
      R3D.frame({ W, H, dpr, cam: { e: [ex, ey, ez], f, u: [0, 0, 1] }, fov: 40, dt,
        players: [{ pl, p: P, visible: true, alpha: 1, pose: 'normal', lookAt: LOOK, faceLook: true, event: null, scale: hScale, holding: false, hasDisc: false, jz: 0, armsUp: 0 }] });
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
</script>
